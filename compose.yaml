services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: tree_editor
      POSTGRES_USER: tree_editor
      POSTGRES_PASSWORD: dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD
        - pg_isready
        - -h
        - 127.0.0.1
        - -U
        - tree_editor
        - -d
        - tree_editor
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres_data: